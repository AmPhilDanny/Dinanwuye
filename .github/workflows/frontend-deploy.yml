name: Deploy Frontend to cPanel

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  FTP_SERVER: ${{ secrets.CPANEL_FTP_HOST }}
  FTP_USERNAME: ${{ secrets.CPANEL_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASS }}
  FTP_SERVER_DIR: public_html/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Build production
        run: pnpm run build
        env:
          VITE_API_BASE_URL: https://api.dinanwuye.com/api/v1
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}

      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/index.html
          test -f dist/sw.js

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASS }}
          local-dir: frontend/dist/
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.log
          dangerous-clean-slate: true

      - name: Verify deployment
        run: |
          sleep 5
          curl -f -s -o /dev/null -w "%{http_code}" https://dinanwuye.com/ | grep -q "200"
          echo "Frontend deployed successfully!"

  notify:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "Frontend deployment failed!"
          # Add Slack/Discord/Email notification here