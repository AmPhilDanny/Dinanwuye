services:
  # Consolidated Backend API (NestJS)
  - type: web
    name: dinanwuye-api
    runtime: node
    plan: starter
    buildCommand: NODE_ENV=development pnpm install --no-frozen-lockfile && npx prisma generate && npx nest build
    startCommand: npx prisma db push --accept-data-loss && node prisma/seed.js && pnpm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: dinanwuye-redis
          property: connectionString
      # Set once in the Render dashboard — do NOT use generateValue here.
      # generateValue rotates the secret on every deploy, invalidating all tokens.
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # Supabase Storage — photos are stored here, NOT on the server filesystem.
      # These must be set in the Render dashboard for photos to work after redeploys.
      - key: SUPABASE_URL
        value: https://ysvqvrskwyyjbeepbyuc.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://dinanwuye.onrender.com,https://dinanwuye-admin.onrender.com
    healthCheckPath: /api/v1/health
    autoDeploy: true
    rootDir: backend/consolidated-app

  # Frontend (Vite + React SPA — Static Site)
  - type: static_site
    name: dinanwuye-frontend
    runtime: static
    plan: starter
    buildCommand: cd frontend && npm install -g pnpm && pnpm install --no-frozen-lockfile && pnpm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://dinanwuye-api.onrender.com
      - key: VITE_MATCHING_URL
        value: https://dinanwuye-matching.onrender.com
      - key: NODE_VERSION
        value: 20.11.0
    autoDeploy: true

  # Admin Frontend (Vite + React SPA — Static Site)
  - type: static_site
    name: dinanwuye-admin
    runtime: static
    plan: starter
    buildCommand: cd admin-frontend && npm install && npm run build
    staticPublishPath: admin-frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_ADMIN_API_URL
        value: https://dinanwuye-api.onrender.com/api/v1/admin
    autoDeploy: true

  # Redis
  - type: redis
    name: dinanwuye-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
