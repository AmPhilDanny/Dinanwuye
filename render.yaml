services:
  # Consolidated Backend API (NestJS)
  - type: web
    name: dinanwuye-api
    runtime: node
    plan: starter
    buildCommand: cd backend/consolidated-app && pnpm install && pnpm run build && npx prisma migrate resolve --applied 20260830000000_init
    startCommand: cd backend/consolidated-app && npx prisma migrate deploy && pnpm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: dinanwuye-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: dinanwuye-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://dinanwuye.onrender.com,https://dinanwuye-admin.onrender.com
    healthCheckPath: /api/v1/health
    autoDeploy: true
    rootDir: backend/consolidated-app

  # PostgreSQL with pgvector
  - type: postgresql
    name: dinanwuye-db
    plan: starter
    databaseName: dinanwuye
    ipAllowList: []

  # Redis
  - type: redis
    name: dinanwuye-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
