services:
  # Consolidated Backend API (NestJS)
  - type: web
    name: dinanwuye-api
    runtime: node
    plan: starter
    buildCommand: NODE_ENV=development pnpm install --no-frozen-lockfile && npx prisma generate && npx nest build
    startCommand: npx prisma migrate deploy && node prisma/seed.js && pnpm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: postgresql://postgres:dinanwuye@2026@db.ysvqvrskwyyjbeepbyuc.supabase.co:5432/postgres
      - key: REDIS_URL
        fromService:
          name: dinanwuye-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://dinanwuye.onrender.com,https://dinanwuye-admin.onrender.com
    healthCheckPath: /api/v1/health
    autoDeploy: true
    rootDir: backend/consolidated-app

  # Redis
  - type: redis
    name: dinanwuye-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
