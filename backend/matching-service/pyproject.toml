[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dinanwuye-matching-service"
version = "0.1.0"
description = "Dinanwuye Matching Service — Python/FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100,<1.0",
    "uvicorn[standard]>=0.23,<1.0",
    "gunicorn>=21.0,<22.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.28,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "redis>=4.6,<6.0",
    "pgvector>=0.2,<1.0",
    "numpy>=1.24,<2.0",
    "scikit-learn>=1.3,<2.0",
    "lightgbm>=4.0,<5.0",
    "httpx>=0.24,<1.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-asyncio>=0.21,<1.0",
    "pytest-cov>=4.1,<6.0",
    "ruff>=0.1,<1.0",
    "mypy>=1.4,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.security.HTTPBearer"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]