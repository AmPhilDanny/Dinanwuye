version: '3.8'

services:
  # PostgreSQL with pgvector for embeddings
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dinanwuye-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dinanwuye
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dinanwuye-network

  # Redis for caching, pub/sub, sessions
  redis:
    image: redis:7-alpine
    container_name: dinanwuye-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dinanwuye-network

  # MinIO for S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: dinanwuye-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - dinanwuye-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: dinanwuye-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api-gateway
      - matching-service
    networks:
      - dinanwuye-network

  # API Gateway (NestJS)
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: dinanwuye-api-gateway
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dinanwuye
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=https://dinanwuye.com,https://www.dinanwuye.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dinanwuye-network

  # Auth Service (NestJS)
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: dinanwuye-auth-service
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dinanwuye
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dinanwuye-network

  # Profile Service (NestJS)
  profile-service:
    build:
      context: .
      dockerfile: profile-service/Dockerfile
    container_name: dinanwuye-profile-service
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dinanwuye
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=dinanwuye-media
      - S3_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dinanwuye-network

  # Messaging Service (NestJS + Socket.IO)
  messaging-service:
    build:
      context: .
      dockerfile: messaging-service/Dockerfile
    container_name: dinanwuye-messaging-service
    environment:
      - NODE_ENV=production
      - PORT=3003
      - WS_PORT=3004
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dinanwuye
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=https://dinanwuye.com,https://www.dinanwuye.com
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dinanwuye-network

  # Trust & Safety Service (NestJS)
  trust-safety-service:
    build:
      context: .
      dockerfile: trust-safety-service/Dockerfile
    container_name: dinanwuye-trust-safety-service
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dinanwuye
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dinanwuye-network

  # Notification Service (NestJS)
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: dinanwuye-notification-service
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dinanwuye
      - REDIS_URL=redis://redis:6379
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=mailto:admin@dinanwuye.com
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dinanwuye-network

  # Payment Service (NestJS)
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: dinanwuye-payment-service
    environment:
      - NODE_ENV=production
      - PORT=3007
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dinanwuye
      - REDIS_URL=redis://redis:6379
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - PAYSTACK_WEBHOOK_SECRET=${PAYSTACK_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dinanwuye-network

  # Matching Service (Python/FastAPI)
  matching-service:
    build:
      context: .
      dockerfile: matching-service/Dockerfile
    container_name: dinanwuye-matching-service
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/dinanwuye
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET}
      - PROFILE_SERVICE_URL=http://profile-service:3002
      - MESSAGING_SERVICE_URL=http://messaging-service:3003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dinanwuye-network

networks:
  dinanwuye-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data: